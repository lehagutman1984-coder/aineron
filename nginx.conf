# Сжатие ответов: JSON API, JS/CSS-бандлы, SVG. text/html сжимается по умолчанию.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml font/woff2 application/wasm;

upstream django {
    server web:8000;
}

upstream nextjs {
    server frontend:3000;
}

upstream daphne {
    server daphne:9000;
}

# SSL и www->apex редирект теперь на уровне edge-nginx (общий для всех
# проектов на этом сервере) - сюда трафик приходит уже расшифрованным,
# обычным http внутри сети edge.
server {
    listen 80;
    server_name aineron.ru www.aineron.ru;

    # 2026-11-18: за общим edge-nginx $remote_addr здесь = IP контейнера edge
    # (172.19.0.x), а не клиента - из-за этого Django видел всех с одного IP
    # и mail-relay для .net отклонял запросы (MAIL_RELAY_ALLOWED_IPS).
    # Edge ставит X-Real-IP = реальный IP клиента (перезаписывая заголовок
    # клиента). Доверяем ему ТОЛЬКО от сети edge, иначе заголовок подделать.
    set_real_ip_from 172.19.0.0/16;
    real_ip_header X-Real-IP;

    if ($host = www.aineron.ru) {
        return 301 https://aineron.ru$request_uri;
    }

    client_max_body_size 100M;

    # 2026-10-02 (аудит безопасности, MEDIUM): Next.js-страницы не отдавали
    # НИКАКИХ security-заголовков (Django свой XFrameOptionsMiddleware/nosniff
    # ставит только для своих ответов, не для фронта). Без них нет защиты от
    # clickjacking (/account/keys, billing, автопродление в <iframe>) и нет
    # HSTS. CSP намеренно НЕ включаем в этот заход — инлайн-скрипты темы и
    # Яндекс.Метрики потребуют nonce/hash, вслепую можно сломать сайт;
    # внедрять нужно отдельным заходом через report-only и проверку живьём.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Статика и медиа (Django) ----------
    location /static/ {
        alias /static/;
    }

    # 2026-10-01 (аудит безопасности, stored XSS): /media/attachments/ (загрузки
    # в чат) и /media/project_files/ (база знаний проекта) разрешают .html/.xml/
    # .sh по расширению — без этих заголовков nginx отдавал их с Content-Type:
    # text/html С ТОГО ЖЕ origin, что и сам кабинет, и браузер жертвы, перейдя
    # по ссылке на чужой .html, выполнял бы код в контексте сессии aineron.ru
    # (создание API-ключей, чтение чатов, трата баланса). Content-Disposition:
    # attachment запрещает инлайн-рендер независимо от Content-Type; nosniff
    # не даёт браузеру угадать text/html по содержимому, даже если расширение
    # не .html. Блоки — ДО общего /media/ (должны матчиться первыми как более
    # специфичный префикс; относительный порядок location в nginx для чистых
    # префиксов не важен — всегда выигрывает самый длинный, но держим явно
    # отдельно и наверху для читаемости).
    location /media/attachments/ {
        alias /media/attachments/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/project_files/ {
        alias /media/project_files/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /media/;
    }

    # ---------- 301 редиректы: Django HTML → Next.js ----------
    location = /aitext/catalog/              { return 301 /models/; }
    location ~ ^/aitext/chatland/([^/]+)/$   { return 301 /models/$1/; }
    location ~ ^/aitext/chat/(\d+)/$         { return 301 /chat/$1/; }
    location = /aitext/files/                { return 301 /account/files/; }
    location = /users/pages/profile/         { return 301 /account/; }
    location = /users/pages/referral/        { return 301 /account/referral/; }
    location = /users/pages/privacy-policy/  { return 301 /privacy-policy/; }
    location = /users/pages/terms-of-service/ { return 301 /terms/; }

    # ---------- Django-маршруты ----------
    # Telegram Bot Webhook
    location /telegram/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Chat SSE streaming — на Daphne, чтобы долгие стримы не занимали
    # sync-воркеры Gunicorn (16 слотов) и не вешали остальной /api/.
    location ~ ^/api/v1/chats/[^/]+/messages/stream/?$ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Studio SSE — async view on Daphne so SSE never blocks Gunicorn worker threads
    # Each SSE connection is a lightweight async coroutine, not an OS thread.
    location ~ ^/api/v1/studio/projects/[^/]+/events/?$ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API для разработчиков (DRF)
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
        # Поддержка SSE-стриминга
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Административная панель
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Пользовательские API и страницы (Django)
    location /users/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # AI-чат и каталог (Django — до миграции на Next.js в ФАЗЕ 3)
    location /aitext/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Allauth
    location /accounts/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # ---------- Gitea ----------
    location /git/ {
        proxy_pass http://gitea:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 100M;
    }

    # ---------- WebSocket (Daphne / Django Channels) ----------
    location /ws/ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Studio sandbox preview ----------
    location ~ ^/studio/preview/(?<cid>[a-zA-Z0-9_]+)/(?<rest>.*)$ {
        resolver 127.0.0.11 valid=10s;
        set $sandbox_upstream http://$cid:3000/$rest;
        proxy_pass $sandbox_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- Next.js (остальные маршруты) ----------
    location /_next/ {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Все остальные маршруты — Next.js (лендинг, каталог после миграции и т.д.)
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
